<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Customer Portal | EcoAudit</title>
  <meta name="description"
    content="Log in to EcoAudit's client portal to review active facility audits, download compliance PDFs, and view your sustainability dashboard.">
  <meta name="keywords" content="client portal login, waste audit records, sustainability log access">

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/animations.css">
</head>

<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <main id="main-content">
    <div class="auth-wrapper">
      <!-- Floating controls in top-right -->
      <div class="auth-controls d-flex align-items-center gap-2">
        <button class="theme-btn rtl-toggle-btn" id="rtlToggleBtn" aria-label="Toggle RTL Layout"
          style="font-size: 0.75rem; font-weight: 500; font-family: var(--font-headings);">RTL</button>
        <button class="theme-btn" aria-label="Toggle dark theme">
          <!-- SVG injected via theme-toggle.js -->
        </button>
      </div>

      <div class="hero-bg-shapes">
        <div class="hero-shape hero-shape-1" style="width: 350px; height: 350px; opacity: 0.1;"></div>
        <div class="hero-shape hero-shape-2" style="width: 300px; height: 300px; opacity: 0.1;"></div>
      </div>

      <div class="auth-panel">
        <div class="auth-logo">
          <a href="index.html" class="logo-link">
            <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" />
            </svg>
            <span>EcoAudit</span>
          </a>
        </div>

        <h2 class="h-large text-center mb-3">Client Portal Access</h2>
        <p class="text-center mb-4" style="font-size: 0.9rem;">Review waste audit weights and download ESG certification
          certificates.</p>

        <form action="index.html" method="GET" onsubmit="alert('Mock Login Successful. Redirecting to Portal...');">
          <div class="form-group">
            <label for="loginEmail" class="form-label">Facility Email Address</label>
            <input type="email" id="loginEmail" class="form-control-eco" placeholder="e.g. facility@company.com"
              required>
          </div>

          <div class="form-group mb-4">
            <label for="loginPass" class="form-label">Portal Password</label>
            <div class="password-input-wrapper">
              <input type="password" id="loginPass" class="form-control-eco" placeholder="Enter secure password"
                required>
              <button type="button" class="password-toggle-btn" aria-label="Toggle password visibility">
                <i data-lucide="eye" style="width: 1.25rem; height: 1.25rem;"></i>
              </button>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between mb-4" style="font-size: 0.75rem;">
            <div class="d-flex align-items-center gap-1">
              <input type="checkbox" id="rememberMe">
              <label for="rememberMe" class="mb-0">Remember me</label>
            </div>
            <a href="404.html">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-eco btn-eco-primary w-100 mb-3">Log In</button>

          <!-- Divider -->
          <div class="d-flex align-items-center my-4">
            <hr class="flex-grow-1" style="border-color: var(--border-color); opacity: 1; margin: 0;">
            <span class="px-3" style="font-size: 0.85rem; color: var(--text-secondary);">or continue with</span>
            <hr class="flex-grow-1" style="border-color: var(--border-color); opacity: 1; margin: 0;">
          </div>

          <!-- Social Buttons -->
          <div class="d-flex flex-column gap-2 mb-4">
            <button type="button"
              class="btn-eco btn-eco-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2"
              style="font-size: 0.9rem;" onclick="alert('Google login initiated...');">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18" height="18">
                <path fill="#EA4335"
                  d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
                <path fill="#4285F4"
                  d="M46.5 24c0-1.55-.15-3.24-.47-4.75H24v9h12.75c-.53 2.87-2.18 5.31-4.62 6.94l7.2 5.58C43.5 35.89 46.5 30.41 46.5 24z" />
                <path fill="#FBBC05"
                  d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z" />
                <path fill="#34A853"
                  d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.2-5.58c-2.11 1.41-4.8 2.39-8.69 2.39-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
              </svg>
              <span>Google</span>
            </button>
            <button type="button"
              class="btn-eco btn-eco-secondary w-100 py-2 d-flex align-items-center justify-content-center gap-2"
              style="font-size: 0.9rem;" onclick="alert('Apple login initiated...');">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="16" height="16"
                fill="currentColor">
                <path
                  d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-48.4-19.3-76.5-19.3-36.9 0-77.1 21-99.3 59.8-46.3 80-11.8 198.8 32.8 263 21.8 31.4 47.9 66.3 81.8 65-32.9-34.3 35.8-65.5 76.2-65.5 40.4 0 108.3 30.7 75.3 65.5 34.3 1.3 59.5-31.5 81.4-63.1 25.2-36.6 35.6-72.2 35.9-74.1-.8-.4-69.5-26.7-69.5-103.1zm-48.2-192.5c24.6-29.6 40.5-70.5 35.9-111.2-34.9 1.4-77.5 23.3-102.5 52.8-20.7 24-38.9 65.5-34.1 105.7 39.3 3.1 79.5-20.4 100.7-47.3z" />
              </svg>
              <span>Apple</span>
            </button>
          </div>

          <p class="text-center mb-0" style="font-size: 0.9rem;">
            New client? <a href="signup.html">Register facility portal</a>
          </p>
        </form>
      </div>
    </div>
  </main>

  <!-- JS files -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      // Password visibility toggle logic
      const toggleBtns = document.querySelectorAll('.password-toggle-btn');
      toggleBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const input = btn.previousElementSibling;
          if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = `<i data-lucide="eye-off" style="width: 1.25rem; height: 1.25rem;"></i>`;
          } else {
            input.type = 'password';
            btn.innerHTML = `<i data-lucide="eye" style="width: 1.25rem; height: 1.25rem;"></i>`;
          }
          lucide.createIcons();
        });
      });
    });
  </script>
</body>

</html>
